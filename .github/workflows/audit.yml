name: Weekly audit

# 依存の脆弱性を週 1 回確かめる。PR や push が無い週でも、新しく公開された
# advisory に気づけるようにするため (ci.yml は PR / push のときしか走らない)。
# 判定は ci.yml と同じ scripts/audit.mjs (BASELINE に無い high 以上が出たら失敗)。
# package-lock.json だけで動くので npm ci はしない (数十秒で終わる)。

on:
  schedule:
    - cron: '0 0 * * 1' # 毎週月曜 09:00 JST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: audit
        run: node scripts/audit.mjs
